name: Workspace tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: repo-intelligence/explorer/package-lock.json
      - name: Install PostgreSQL and Python dependencies
        working-directory: repo-intelligence
        run: |
          sudo apt-get update -q
          sudo apt-get install -y postgresql
          pg_config --bindir >> "$GITHUB_PATH"
          python -m venv .venv
          .venv/bin/pip install -e '.[dev]'
      - name: Run backend suite and goldens
        working-directory: repo-intelligence
        run: |
          .venv/bin/python -m pytest -q
          .venv/bin/python -m repo_intel.golden_check
      - name: Run Explorer browser suite
        working-directory: repo-intelligence/explorer
        run: |
          npm ci
          npm run typecheck
          npx playwright install --with-deps chromium
          npm run test:e2e
