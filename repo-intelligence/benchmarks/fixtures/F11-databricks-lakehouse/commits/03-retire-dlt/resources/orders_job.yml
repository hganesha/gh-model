resources:
  jobs:
    orders_daily:
      name: orders-daily-${bundle.target}
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: UTC
      tasks:
        - task_key: ingest
          notebook_task:
            notebook_path: ../src/ingest_orders
        - task_key: transform
          depends_on:
            - task_key: ingest
          spark_python_task:
            python_file: ../src/transform.py
        - task_key: train
          depends_on:
            - task_key: transform
          notebook_task:
            notebook_path: ../src/train_churn

