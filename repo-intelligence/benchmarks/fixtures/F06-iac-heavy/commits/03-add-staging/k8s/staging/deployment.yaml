apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-api
  namespace: staging
spec:
  replicas: 1
  selector:
    matchLabels: {app: status-api}
  template:
    metadata:
      labels: {app: status-api}
    spec:
      containers:
        - name: api
          image: registry.example.com/status-api:1.5.0
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: status-db, key: url}
