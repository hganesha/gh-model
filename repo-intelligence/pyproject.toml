[project]
name = "repo-intel"
version = "0.1.0"
description = "GitHub Intelligence Engine: repository knowledge compiler (spec v2.0)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "rfc8785>=0.1.4",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "psycopg[binary]>=3.2",
  "temporalio>=1.8",
  "cryptography>=44",
  "keyring>=25",
  "PyYAML>=6",
  "httpx>=0.27",
  "sqlglot>=26",
  "python-hcl2>=7",
  "tree-sitter>=0.25,<0.28",
  "tree-sitter-python>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-typescript>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]
azure = ["azure-identity>=1.17"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["repo_intel*"]

[tool.setuptools.package-data]
repo_intel = ["technical_capabilities.json", "decisions/model_pins.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["temporal: needs a Temporal dev server (opt in with RKP_TEMPORAL_TESTS=1)"]
