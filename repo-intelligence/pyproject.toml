[project]
name = "repo-intel"
version = "0.1.0"
description = "GitHub Intelligence Engine: repository knowledge compiler (spec v2.0)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "rfc8785>=0.1.4",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "psycopg[binary]>=3.2",
  "temporalio>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["repo_intel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["temporal: needs a Temporal dev server (opt in with RKP_TEMPORAL_TESTS=1)"]
